[build]
  command = "npm i --no-save --no-audit --no-fund playwright@1.56.0 && npx playwright install chromium && npm run build:static"
  publish = "dist"

# docs/STATIC_HOSTING.md requirement 3: any extension-less path that isn't one of the
# prerendered routes must serve the untouched SPA shell (dist/spa-fallback.html) with
# HTTP 200 — this is today's Lovable "soft 404" behaviour and must not become a hard 404
# (that would be an SEO change and needs the owner's approval, see hard rule 1).
#
# Netlify only applies a redirect when no real file exists at the requested path, so this
# catch-all never shadows any of the 288 prerendered `dist/<path>/index.html` files or the
# static assets under `public/` (sitemaps, robots.txt, images, blog-md, etc.) — those keep
# being served directly.
[[redirects]]
  from = "/*"
  to = "/spa-fallback.html"
  status = 200
